name: Refresh EV Data Cache

on:
  schedule:
    - cron: '0 2 * * 0'  # Every Sunday at 2:00 AM UTC (7 hours before Mon 9 AM EDT)
  workflow_dispatch:      # Allow manual trigger from the GitHub Actions UI

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch EIA and EPA data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python .github/scripts/fetch-ev-data.py

      - name: Commit and push if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data-cache.json
          if git diff --cached --quiet; then
            echo "data-cache.json unchanged — no commit needed"
          else
            git commit -m "chore: refresh EV data cache $(date -u +%Y-%m-%d)"
            git push
          fi
